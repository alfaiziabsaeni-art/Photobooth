<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Photobooth Kamu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { margin: 0; font-family: 'Outfit', sans-serif; background-color: #fdfbfb; color: #2d3436; text-align: center; overflow-x: hidden; }
        .bg-mesh { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden; background-color: #f8f9fa; }
        .orb-1 { position: absolute; width: 60vw; height: 60vw; background: #ffd1dc; filter: blur(120px); top: -20vw; left: -20vw; border-radius: 50%; opacity: 0.7; }
        .orb-2 { position: absolute; width: 50vw; height: 50vw; background: #d4e0ff; filter: blur(120px); bottom: -10vw; right: -10vw; border-radius: 50%; opacity: 0.7; }

        h1 { margin-top: 40px; font-weight: 800; font-size: 32px; color: #2d3436; text-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        h1 span { background: linear-gradient(135deg, #a18cd1, #fbc2eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .gallery-container { display: flex; flex-direction: column; align-items: center; gap: 30px; padding: 20px 20px 80px 20px; max-width: 800px; margin: 0 auto; }
        .photo-card { background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); border-radius: 30px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.05); width: 100%; max-width: 500px; box-sizing: border-box; border: 2px solid white; transition: transform 0.3s ease; }
        .photo-card:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .photo-card img { width: 100%; border-radius: 15px; border: 1px solid rgba(0,0,0,0.05); display: block; margin-bottom: 20px; background: #fdfbfb; }
        
        .btn-download { display: inline-block; background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); color: white; padding: 15px 30px; text-decoration: none; font-weight: 800; border-radius: 30px; transition: 0.3s; font-size: 16px; width: 100%; box-sizing: border-box; box-shadow: 0 10px 20px rgba(255, 154, 158, 0.4); text-transform: uppercase; letter-spacing: 1px; }
        .btn-download:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 154, 158, 0.6); }
        .error-msg { color: #a29bfe; font-size: 18px; margin-top: 50px; font-weight: 600; }
        .loading-spinner { font-size: 50px; color: #a18cd1; animation: spin 2s infinite linear; display: block; margin: 50px auto; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1)); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-mesh">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <h1>Galeri <span>Photobooth</span></h1>
    <p>Ketuk tombol di bawah foto untuk menyimpan ke perangkat</p>

    <div id="loader" class="loader"></div>
    <div id="gallery" class="gallery-container"></div>

    <script>
        // Ambil ID sesi dari URL browser (misal: galeri.html?sesi=12345)
        const urlParams = new URLSearchParams(window.location.search);
        const idSesi = urlParams.get('sesi');
        
        // Kredensial Cloudinary milikmu
        const CLOUD_NAME = "dgujlw4e1";

        if (!idSesi) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('gallery').innerHTML = "<p class='error-msg'>ID Sesi tidak ditemukan. Silakan scan ulang QR Code asli.</p>";
        } else {
            fetchGaleriFoto();
        }

        function fetchGaleriFoto() {
            // Mengambil daftar file dari Cloudinary secara publik yang memiliki TAG sesuai ID Sesi
            // Menggunakan daftar JSON terkirim berkat pengaturan resource_type image
            const urlDaftarAset = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${idSesi}.json`;

            fetch(urlDaftarAset)
            .then(res => {
                if (!res.ok) throw new Error("Aset belum siap atau tidak ditemukan.");
                return res.json();
            })
            .then(data => {
                document.getElementById('loader').style.display = 'none';
                
                if (!data.resources || data.resources.length === 0) {
                    document.getElementById('gallery').innerHTML = "<p class='error-msg'>Foto-foto kamu sedang diproses, coba segarkan halaman ini.</p>";
                    return;
                }

                // Urutkan berdasarkan tinggi gambar agar Foto Strip Gabungan (yang paling tinggi) berada paling atas
                data.resources.sort((a, b) => b.height - a.height);

                data.resources.forEach((resource, index) => {
                    // Buat URL unduhan penuh dari Cloudinary
                    const urlGambarMurni = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/v${resource.version}/${resource.public_id}.${resource.format}`;
                    
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    
                    // Keterangan judul jenis foto
                    let judulFoto = `Foto Satuan #${index}`;
                    if (index === 0) {
                        judulFoto = "✨ Cetakan Frame Strip (Utama)";
                    }

                    card.innerHTML = `
                        <h3 style="margin-top:0; font-size:16px;">${judulFoto}</h3>
                        <img src="${urlGambarMurni}" alt="Foto">
                        <a href="${urlGambarMurni}" target="_blank" download="photobooth-${idSesi}-${index}.png" class="btn-download">⬇️ Simpan Foto</a>
                    `;
                    document.getElementById('gallery').appendChild(card);
                });
            })
            .catch(err => {
                console.error(err);
                // Lakukan percobaan ulang otomatis setelah 3 detik jika cloud telat memproses list tag
                setTimeout(fetchGaleriFoto, 3000);
            });
        }
    </script>
</body>
</html>
